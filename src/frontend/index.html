<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ClinicalRAG</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sb">
    <div class="sb-logo">
      <div class="sb-logo-name">ClinicalRAG</div>
      <div class="sb-logo-tag">Document Intelligence</div>
    </div>
    <div class="sb-lbl">Documents</div>
    <div class="doc-list" id="doc-list">
      <div class="doc-empty">Loading...</div>
    </div>
    <div class="sb-bottom">
      <button class="upload-btn" id="upload-btn">Upload PDF</button>
      <div class="upload-msg" id="upload-msg"></div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <header class="hdr">
      <div class="hdr-l">
        <span class="live"><span class="dot"></span>gpt-oss-120b via Groq</span>
        <span class="hdr-stat" id="hdr-stat"><b>0</b> chunks indexed</span>
      </div>
      <div class="hdr-r">
        <a class="icon-btn" href="https://github.com/REZZOUGAICHA/ClinicalRAG" target="_blank" rel="noopener noreferrer" title="Source code on GitHub" aria-label="Source code on GitHub">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
        <button class="icon-btn" id="theme-btn" title="Toggle theme">☾</button>
      </div>
    </header>

    <div class="chat" id="chat">
      <div class="welcome" id="welcome">
        <h2>Clinical Document Intelligence</h2>
        <div class="wline"></div>
        <p>Upload clinical PDF reports and ask questions. Every answer is grounded in your documents with source citations.</p>
        <div class="eg-list">
          <button class="eg">What was the WBC count in the lymphoma patient?</button>
          <button class="eg">What medications was the stroke patient discharged with?</button>
          <button class="eg">What is the HbA1c of the diabetic patient?</button>
          <button class="eg">Which patient was admitted to the ICU and why?</button>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-row">
        <div class="input-wrap">
          <textarea id="qi" rows="1" placeholder="Ask a clinical question about your documents..."></textarea>
        </div>
        <button class="send-btn" id="send-btn">Ask</button>
      </div>
      <div class="input-foot">
        <span class="foot-l">
          <span class="hint">Enter to send · Shift+Enter for newline</span>
        </span>
        <span class="hint" id="foot-stat"></span>
      </div>
    </div>
  </main>
</div>

<!-- Modal -->
<div class="modal-ov" id="modal">
  <div class="modal">
    <div class="modal-hdr">
      <div>
        <div class="modal-sec" id="m-sec"></div>
        <div class="modal-src" id="m-src"></div>
      </div>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-body" id="m-body"></div>
  </div>
</div>

<input type="file" id="file-in" accept=".pdf" style="display:none">

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
